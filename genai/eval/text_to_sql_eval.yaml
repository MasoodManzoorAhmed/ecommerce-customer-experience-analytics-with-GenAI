# Evaluation set for GenAI Module 1 ("Ask the data", text-to-SQL).
#
# Each item: a business question as a manager would type it, the GOLD SQL that answers it
# (hand-written and checked), a difficulty and tags saying what the question tests.
# The expected result of every item is produced by running its gold SQL
# (python -m genai.text_to_sql.eval_set -> genai/eval/text_to_sql_expected.json), and a model's
# answer counts as correct when its result matches (execution accuracy).
#
# Rules for this file:
# - Questions follow the business definitions in genai/semantic_layer.yaml (e.g. "revenue" means
#   delivered orders, excluding freight), as a real user would assume.
# - None of these questions may appear in the few-shot examples (genai/text_to_sql/examples.jsonl).
# - YAML (not JSONL) so the multi-line SQL stays readable and reviewable.
#
# Tags: count, filter, aggregate, group, rank, time, join, window, ratio, threshold,
#       metric-definition (needs the semantic layer), fan-out (needs item-level care),
#       entity-mapping (state names -> codes), model (fact_order_risk)

items:
  # ---------------------------------------------------------------- easy
  - id: e01
    difficulty: easy
    tags: [count]
    question: How many orders are there in total, of any status?
    gold_sql: |
      SELECT COUNT(*) AS orders
      FROM fact_orders

  - id: e02
    difficulty: easy
    tags: [count, filter, metric-definition]
    question: How many orders were delivered?
    gold_sql: |
      SELECT COUNT(*) AS delivered_orders
      FROM fact_orders
      WHERE is_delivered

  - id: e03
    difficulty: easy
    tags: [aggregate, metric-definition]
    question: What is the total revenue?
    gold_sql: |
      SELECT ROUND(SUM(order_value), 2) AS revenue
      FROM fact_orders
      WHERE is_delivered

  - id: e04
    difficulty: easy
    tags: [count, metric-definition]
    question: How many customers have placed at least one order?
    gold_sql: |
      SELECT COUNT(DISTINCT customer_key) AS customers
      FROM fact_orders

  - id: e05
    difficulty: easy
    tags: [count]
    question: How many sellers are there?
    gold_sql: |
      SELECT COUNT(*) AS sellers
      FROM dim_seller

  - id: e06
    difficulty: easy
    tags: [count, filter]
    question: How many products have no product category?
    gold_sql: |
      SELECT COUNT(*) AS products_without_category
      FROM dim_product
      WHERE category_en = 'unknown'

  - id: e07
    difficulty: easy
    tags: [aggregate, metric-definition]
    question: What is the average review score?
    gold_sql: |
      SELECT ROUND(AVG(review_score), 2) AS average_review
      FROM fact_orders
      WHERE is_delivered

  - id: e08
    difficulty: easy
    tags: [count, filter]
    question: How many delivered orders were paid mainly by boleto?
    gold_sql: |
      SELECT COUNT(*) AS boleto_orders
      FROM fact_orders
      WHERE is_delivered AND payment_type_main = 'boleto'

  - id: e09
    difficulty: easy
    tags: [ratio, metric-definition]
    question: What is the average order value?
    gold_sql: |
      SELECT ROUND(SUM(order_value) / COUNT(*), 2) AS average_order_value
      FROM fact_orders
      WHERE is_delivered

  - id: e10
    difficulty: easy
    tags: [count, filter, metric-definition]
    question: How many orders arrived late?
    gold_sql: |
      SELECT COUNT(*) AS late_orders
      FROM fact_orders
      WHERE is_delivered AND is_late

  - id: e11
    difficulty: easy
    tags: [ratio, metric-definition]
    question: What is the on-time delivery rate, as a percentage?
    gold_sql: |
      SELECT ROUND(100.0 * (1 - AVG(is_late::INT)), 2) AS on_time_rate_pct
      FROM fact_orders
      WHERE is_delivered

  - id: e12
    difficulty: easy
    tags: [aggregate, metric-definition]
    question: On average, how many days does a delivery take?
    gold_sql: |
      SELECT ROUND(AVG(delivery_days), 2) AS average_delivery_days
      FROM fact_orders
      WHERE is_delivered

  - id: e13
    difficulty: easy
    tags: [count, filter]
    question: How many orders were canceled?
    gold_sql: |
      SELECT COUNT(*) AS canceled_orders
      FROM fact_orders
      WHERE order_status = 'canceled'

  - id: e14
    difficulty: easy
    tags: [aggregate, filter]
    question: What is the total freight value of delivered orders?
    gold_sql: |
      SELECT ROUND(SUM(freight_value), 2) AS freight_value
      FROM fact_orders
      WHERE is_delivered

  - id: e15
    difficulty: easy
    tags: [count, filter, entity-mapping]
    question: How many customers live in the state of Rio de Janeiro?
    gold_sql: |
      SELECT COUNT(*) AS customers
      FROM dim_customer
      WHERE state = 'RJ'

  # ---------------------------------------------------------------- medium
  - id: m01
    difficulty: medium
    tags: [group, time, metric-definition]
    question: What was the revenue in each year?
    gold_sql: |
      SELECT year(purchase_ts) AS year, ROUND(SUM(order_value), 2) AS revenue
      FROM fact_orders
      WHERE is_delivered
      GROUP BY year
      ORDER BY year

  - id: m02
    difficulty: medium
    tags: [join, group, rank, metric-definition]
    question: Which 5 states generated the most revenue? Show each state and its revenue.
    gold_sql: |
      SELECT c.state, ROUND(SUM(f.order_value), 2) AS revenue
      FROM fact_orders AS f
      JOIN dim_customer AS c ON c.customer_key = f.customer_key
      WHERE f.is_delivered
      GROUP BY c.state
      ORDER BY revenue DESC
      LIMIT 5

  - id: m03
    difficulty: medium
    tags: [group, time, filter]
    # Format added after the baseline review: "January" vs "2018-01" was a label ambiguity
    question: How many orders were delivered in each month of 2018? Show the month as YYYY-MM.
    gold_sql: |
      SELECT strftime(purchase_ts, '%Y-%m') AS month, COUNT(*) AS delivered_orders
      FROM fact_orders
      WHERE is_delivered AND year(purchase_ts) = 2018
      GROUP BY month
      ORDER BY month

  - id: m04
    difficulty: medium
    tags: [join, group, rank, ratio, threshold]
    question: >-
      Among states with at least 500 delivered orders, which 5 have the lowest on-time
      delivery rate? Show the state and the on-time rate as a percentage.
    gold_sql: |
      SELECT c.state, ROUND(100.0 * (1 - AVG(f.is_late::INT)), 2) AS on_time_rate_pct
      FROM fact_orders AS f
      JOIN dim_customer AS c ON c.customer_key = f.customer_key
      WHERE f.is_delivered
      GROUP BY c.state
      HAVING COUNT(*) >= 500
      ORDER BY on_time_rate_pct ASC
      LIMIT 5

  - id: m05
    difficulty: medium
    tags: [join, group, rank, fan-out]
    question: What are the top 10 product categories by revenue?
    gold_sql: |
      SELECT p.category_en AS category, ROUND(SUM(i.price), 2) AS revenue
      FROM fact_order_items AS i
      JOIN fact_orders AS f ON f.order_id = i.order_id
      JOIN dim_product AS p ON p.product_key = i.product_key
      WHERE f.is_delivered
      GROUP BY p.category_en
      ORDER BY revenue DESC
      LIMIT 10

  - id: m06
    difficulty: medium
    tags: [group, metric-definition]
    question: >-
      What is the average review score of late deliveries compared with on-time deliveries?
      Label the two groups 'late' and 'on time'.
    gold_sql: |
      SELECT CASE WHEN is_late THEN 'late' ELSE 'on time' END AS delivery,
             ROUND(AVG(review_score), 2) AS average_review
      FROM fact_orders
      WHERE is_delivered
      GROUP BY delivery
      ORDER BY delivery

  - id: m07
    difficulty: medium
    tags: [group, rank, ratio]
    question: Which payment method has the highest average order value, and what is it?
    gold_sql: |
      SELECT payment_type_main AS payment_method,
             ROUND(SUM(order_value) / COUNT(*), 2) AS average_order_value
      FROM fact_orders
      WHERE is_delivered AND payment_type_main IS NOT NULL
      GROUP BY payment_type_main
      ORDER BY average_order_value DESC
      LIMIT 1

  - id: m08
    difficulty: medium
    tags: [ratio, filter]
    question: What percentage of delivered orders were paid mainly by credit card?
    gold_sql: |
      SELECT ROUND(100.0 * AVG((payment_type_main = 'credit_card')::INT), 2) AS credit_card_pct
      FROM fact_orders
      WHERE is_delivered

  - id: m09
    difficulty: medium
    tags: [group, rank]
    question: Which 3 seller states have the most sellers? Show the state and the number of sellers.
    gold_sql: |
      SELECT state, COUNT(*) AS sellers
      FROM dim_seller
      GROUP BY state
      ORDER BY sellers DESC
      LIMIT 3

  - id: m10
    difficulty: medium
    tags: [join, group, rank]
    question: Which 5 states have the longest average delivery time, in days?
    gold_sql: |
      SELECT c.state, ROUND(AVG(f.delivery_days), 2) AS average_delivery_days
      FROM fact_orders AS f
      JOIN dim_customer AS c ON c.customer_key = f.customer_key
      WHERE f.is_delivered
      GROUP BY c.state
      ORDER BY average_delivery_days DESC
      LIMIT 5

  - id: m11
    difficulty: medium
    tags: [filter, time, metric-definition]
    question: What was the revenue in November 2017?
    gold_sql: |
      SELECT ROUND(SUM(order_value), 2) AS revenue
      FROM fact_orders
      WHERE is_delivered AND strftime(purchase_ts, '%Y-%m') = '2017-11'

  - id: m12
    difficulty: medium
    tags: [group, rank, time]
    question: On which day of the week are the most orders placed?
    gold_sql: |
      SELECT dayname(purchase_ts) AS weekday, COUNT(*) AS orders
      FROM fact_orders
      GROUP BY weekday
      ORDER BY orders DESC
      LIMIT 1

  - id: m13
    difficulty: medium
    tags: [ratio, metric-definition]
    question: What percentage of reviews of delivered orders gave 5 stars?
    gold_sql: |
      SELECT ROUND(100.0 * AVG((review_score = 5)::INT), 2) AS five_star_pct
      FROM fact_orders
      WHERE is_delivered AND review_score IS NOT NULL

  - id: m14
    difficulty: medium
    tags: [group, count, metric-definition]
    question: How many customers placed more than one delivered order?
    gold_sql: |
      SELECT COUNT(*) AS repeat_customers
      FROM (
          SELECT customer_key
          FROM fact_orders
          WHERE is_delivered
          GROUP BY customer_key
          HAVING COUNT(*) > 1
      )

  - id: m15
    difficulty: medium
    tags: [aggregate]
    question: What is the average number of items per delivered order?
    gold_sql: |
      SELECT ROUND(AVG(n_items), 2) AS average_items
      FROM fact_orders
      WHERE is_delivered

  - id: m16
    difficulty: medium
    tags: [join, filter, fan-out]
    question: What is the revenue of the office_furniture category?
    gold_sql: |
      SELECT ROUND(SUM(i.price), 2) AS revenue
      FROM fact_order_items AS i
      JOIN fact_orders AS f ON f.order_id = i.order_id
      JOIN dim_product AS p ON p.product_key = i.product_key
      WHERE f.is_delivered AND p.category_en = 'office_furniture'

  - id: m17
    difficulty: medium
    tags: [group, metric-definition]
    question: What is the average review score for each payment method?
    gold_sql: |
      SELECT payment_type_main AS payment_method, ROUND(AVG(review_score), 2) AS average_review
      FROM fact_orders
      WHERE is_delivered AND payment_type_main IS NOT NULL
      GROUP BY payment_type_main
      ORDER BY payment_method

  - id: m18
    difficulty: medium
    tags: [count, filter]
    question: How many delivered orders received a 1-star review?
    gold_sql: |
      SELECT COUNT(*) AS one_star_orders
      FROM fact_orders
      WHERE is_delivered AND review_score = 1

  # ---------------------------------------------------------------- hard
  - id: h01
    difficulty: hard
    tags: [window, time, metric-definition]
    # Format added after the baseline review (same label ambiguity as m03)
    question: >-
      What was the month-over-month revenue growth, in percent, for each month from January
      to August 2018? Show the month as YYYY-MM.
    gold_sql: |
      WITH monthly AS (
          SELECT strftime(purchase_ts, '%Y-%m') AS month, SUM(order_value) AS revenue
          FROM fact_orders
          WHERE is_delivered
          GROUP BY month
      )
      SELECT month, ROUND(100.0 * (revenue / LAG(revenue) OVER (ORDER BY month) - 1), 2) AS mom_growth_pct
      FROM monthly
      QUALIFY month BETWEEN '2018-01' AND '2018-08'
      ORDER BY month

  - id: h02
    difficulty: hard
    tags: [join, group, rank, fan-out]
    question: Who are the top 5 sellers by revenue? Show the seller id and the revenue.
    gold_sql: |
      SELECT s.seller_id, ROUND(SUM(i.price), 2) AS revenue
      FROM fact_order_items AS i
      JOIN fact_orders AS f ON f.order_id = i.order_id
      JOIN dim_seller AS s ON s.seller_key = i.seller_key
      WHERE f.is_delivered
      GROUP BY s.seller_id
      ORDER BY revenue DESC
      LIMIT 5

  - id: h03
    difficulty: hard
    tags: [join, group, rank, ratio, threshold, fan-out]
    question: >-
      Among sellers with at least 100 delivered orders, which 5 have the lowest on-time rate?
      Show the seller id, their number of delivered orders and the on-time rate as a percentage.
    gold_sql: |
      WITH seller_orders AS (
          SELECT DISTINCT i.seller_key, f.order_id, f.is_late
          FROM fact_order_items AS i
          JOIN fact_orders AS f ON f.order_id = i.order_id
          WHERE f.is_delivered
      )
      SELECT s.seller_id, COUNT(*) AS delivered_orders,
             ROUND(100.0 * (1 - AVG(so.is_late::INT)), 2) AS on_time_rate_pct
      FROM seller_orders AS so
      JOIN dim_seller AS s ON s.seller_key = so.seller_key
      GROUP BY s.seller_id
      HAVING COUNT(*) >= 100
      ORDER BY on_time_rate_pct ASC
      LIMIT 5

  - id: h04
    difficulty: hard
    tags: [join, ratio, entity-mapping, metric-definition]
    question: What share of revenue, in percent, comes from customers in São Paulo state?
    gold_sql: |
      SELECT ROUND(100.0 * SUM(f.order_value) FILTER (WHERE c.state = 'SP') / SUM(f.order_value), 2)
             AS sp_revenue_share_pct
      FROM fact_orders AS f
      JOIN dim_customer AS c ON c.customer_key = f.customer_key
      WHERE f.is_delivered

  - id: h05
    difficulty: hard
    tags: [ratio, metric-definition]
    question: What percentage of customers made more than one delivered order?
    gold_sql: |
      SELECT ROUND(100.0 * AVG((n > 1)::INT), 2) AS repeat_customer_pct
      FROM (
          SELECT customer_key, COUNT(*) AS n
          FROM fact_orders
          WHERE is_delivered
          GROUP BY customer_key
      )

  - id: h06
    difficulty: hard
    tags: [join, window, ratio, fan-out]
    question: What share of revenue, in percent, do the top 10 product categories account for?
    gold_sql: |
      WITH category_revenue AS (
          SELECT p.category_en, SUM(i.price) AS revenue
          FROM fact_order_items AS i
          JOIN fact_orders AS f ON f.order_id = i.order_id
          JOIN dim_product AS p ON p.product_key = i.product_key
          WHERE f.is_delivered
          GROUP BY p.category_en
      )
      SELECT ROUND(100.0 * SUM(revenue) FILTER (WHERE rank <= 10) / SUM(revenue), 2) AS top10_share_pct
      FROM (SELECT revenue, ROW_NUMBER() OVER (ORDER BY revenue DESC) AS rank FROM category_revenue)

  - id: h07
    difficulty: hard
    tags: [join, group, ratio, model]
    question: >-
      For orders in the late-delivery model's test period, what is the actual late rate, in
      percent, in each risk band?
    gold_sql: |
      SELECT r.risk_band, ROUND(100.0 * AVG(f.is_late::INT), 2) AS late_rate_pct
      FROM fact_order_risk AS r
      JOIN fact_orders AS f ON f.order_id = r.order_id
      WHERE r.split = 'test'
      GROUP BY r.risk_band
      ORDER BY late_rate_pct DESC

  - id: h08
    difficulty: hard
    tags: [filter, aggregate]
    question: What is the average review score of orders delivered more than 7 days after the estimated date?
    gold_sql: |
      SELECT ROUND(AVG(review_score), 2) AS average_review
      FROM fact_orders
      WHERE is_delivered AND delay_days > 7

  - id: h09
    difficulty: hard
    tags: [group, rank, time, ratio]
    question: >-
      Between January 2017 and August 2018, which month had the highest late-delivery rate, and
      what was that rate in percent?
    gold_sql: |
      SELECT strftime(purchase_ts, '%Y-%m') AS month, ROUND(100.0 * AVG(is_late::INT), 2) AS late_rate_pct
      FROM fact_orders
      WHERE is_delivered AND purchase_ts >= DATE '2017-01-01' AND purchase_ts < DATE '2018-09-01'
      GROUP BY month
      ORDER BY late_rate_pct DESC
      LIMIT 1

  - id: h10
    difficulty: hard
    tags: [group, aggregate, filter]
    question: For delivered orders, what is the median approval time in hours for boleto and for credit card payments?
    gold_sql: |
      SELECT payment_type_main AS payment_method, ROUND(MEDIAN(approval_hours), 2) AS median_approval_hours
      FROM fact_orders
      WHERE is_delivered AND payment_type_main IN ('boleto', 'credit_card')
      GROUP BY payment_type_main
      ORDER BY payment_method

  - id: h11
    difficulty: hard
    tags: [join, window, fan-out]
    question: What is the smallest number of sellers that together generate 80% of revenue?
    gold_sql: |
      WITH seller_revenue AS (
          SELECT i.seller_key, SUM(i.price) AS revenue
          FROM fact_order_items AS i
          JOIN fact_orders AS f ON f.order_id = i.order_id
          WHERE f.is_delivered
          GROUP BY i.seller_key
      ),
      ranked AS (
          SELECT revenue,
                 SUM(revenue) OVER (ORDER BY revenue DESC, seller_key
                                    ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS revenue_before,
                 SUM(revenue) OVER () AS total
          FROM seller_revenue
      )
      SELECT COUNT(*) AS sellers_for_80pct
      FROM ranked
      WHERE COALESCE(revenue_before, 0) < 0.8 * total

  - id: h12
    difficulty: hard
    tags: [time, ratio, metric-definition]
    question: By what percentage did revenue grow in August 2018 compared with August 2017?
    gold_sql: |
      SELECT ROUND(100.0 * (
                 SUM(order_value) FILTER (WHERE strftime(purchase_ts, '%Y-%m') = '2018-08')
               / SUM(order_value) FILTER (WHERE strftime(purchase_ts, '%Y-%m') = '2017-08') - 1), 2)
             AS yoy_growth_pct
      FROM fact_orders
      WHERE is_delivered

  - id: h13
    difficulty: hard
    tags: [join, group, rank, ratio, threshold, fan-out]
    # Asks for 2, not 1: office_furniture (91.946%) and baby (91.954%) tie at 2 decimals.
    question: >-
      Among product categories with at least 500 delivered orders, which 2 have the lowest
      on-time rate? Show the category and the on-time rate in percent.
    gold_sql: |
      WITH category_orders AS (
          SELECT DISTINCT p.category_en, f.order_id, f.is_late
          FROM fact_order_items AS i
          JOIN fact_orders AS f ON f.order_id = i.order_id
          JOIN dim_product AS p ON p.product_key = i.product_key
          WHERE f.is_delivered
      )
      SELECT category_en AS category, ROUND(100.0 * (1 - AVG(is_late::INT)), 2) AS on_time_rate_pct
      FROM category_orders
      GROUP BY category_en
      HAVING COUNT(*) >= 500
      ORDER BY AVG(is_late::INT) DESC
      LIMIT 2
