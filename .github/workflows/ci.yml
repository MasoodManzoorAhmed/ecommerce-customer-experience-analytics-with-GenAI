# Runs on every push and pull request: lint, then the test suite.
# The Olist data and DuckDB file are not in the repo (git-ignored), so tests that need the
# database skip themselves; everything else (guardrails, evaluator, leakage checks, app
# logic on the committed extracts, Module 2 parsing and scoring) runs here.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: the default Linux wheel bundles CUDA (several GB)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q
