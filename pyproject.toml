[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the project root on the import path, so plain `pytest` (not only `python -m pytest`) finds src/, genai/, app/
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# notebooks add the project root to sys.path before importing from src/
"notebooks/*.ipynb" = ["E402"]
# long SQL strings that mirror DAX measures one-to-one
"scripts/powerbi_expected_values.py" = ["E501"]
